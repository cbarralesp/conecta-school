<article class="document-card" [class.document-card--compact]="compact">
  <div class="document-card__icon" [class]="toneClass()">
    <mat-icon>{{ iconName() }}</mat-icon>
  </div>

  <div class="document-card__content">
    <div class="document-card__header">
      <h5>{{ document.name }}</h5>
      <span class="document-card__type">{{ typeLabel() }}</span>
    </div>

    <p>{{ (document.sizeBytes / 1024) | number:'1.0-0' }} KB · {{ document.uploadedAt | date:'dd-MM-yyyy' }}</p>

    <div class="document-card__badges">
      @if (document.visibleToStudents) {
        <span class="badge badge--success">Disponible</span>
      } @else {
        <span class="badge badge--muted">Solo docente</span>
      }
      @if (document.freshnessLabel === 'Nuevo') {
        <span class="badge badge--warning">Nuevo</span>
      }
    </div>
  </div>

  <div class="document-card__actions">
    <button mat-stroked-button type="button" (click)="download()">
      <mat-icon>download</mat-icon>
      Descargar
    </button>
    <button mat-icon-button color="warn" type="button" [disabled]="deleting" (click)="delete()" aria-label="Eliminar documento">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</article>
