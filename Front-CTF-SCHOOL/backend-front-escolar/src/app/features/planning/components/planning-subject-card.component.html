<section class="subject-card">
  <div class="subject-card__header">
    <div>
      <h3>{{ subject.subjectName }}</h3>
      <p>{{ subject.semesterLabel }} · {{ subject.totalUnits }} unidades</p>
    </div>

    <div class="subject-card__metrics">
      <span>{{ subject.totalDocuments }} archivos</span>
      <span>{{ subject.visibleDocuments }} disponibles</span>
      <span>{{ subject.teacherOnlyDocuments }} solo docente</span>
    </div>
  </div>

  <div class="subject-card__units">
    @for (unit of subject.units; track unit.id) {
      <app-planning-unit-card
        [unit]="unit"
        [viewMode]="viewMode"
        [deletingDocumentId]="deletingDocumentId"
        (downloadDocument)="downloadDocument.emit($event)"
        (deleteDocument)="deleteDocument.emit($event)"
      />
    }
  </div>
</section>
