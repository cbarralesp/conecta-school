services:
  db:
    image: postgres:16
    container_name: sistema_escolar_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_escolar}
      POSTGRES_USER: ${POSTGRES_USER:-escolar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escolar_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    image: ${BACKEND_IMAGE:-crbarrales/conectaschool:backend-latest}
    container_name: sistema_escolar_backend
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/sistema_escolar}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-escolar_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-escolar_pass}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://127.0.0.1}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-change-this-jwt-secret-in-production}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    image: ${FRONTEND_IMAGE:-crbarrales/conectaschool:frontend-latest}
    container_name: sistema_escolar_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
