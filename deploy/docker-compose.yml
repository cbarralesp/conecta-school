services:
  db:
    image: ${DB_IMAGE:-crbarrales/conectaschool-tfs:db-latest}
    container_name: sistema_escolar_db
    restart: always
    environment:
      TZ: America/Santiago
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_USER: ${POSTGRES_USER:-escolar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escolar_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-escolar_user} -d ${POSTGRES_DB:-demo}"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

  backend:
    image: ${BACKEND_IMAGE:-crbarrales/conectaschool-tfs:backend-latest}
    container_name: sistema_escolar_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Santiago
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/demo}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-escolar_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-escolar_pass}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,demo}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://127.0.0.1,http://app.codestress.cl,https://app.codestress.cl,http://tfs.conectaschool.cl,https://tfs.conectaschool.cl}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-change-this-jwt-secret-in-production}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    image: ${FRONTEND_IMAGE:-crbarrales/conectaschool-tfs:frontend-latest}
    container_name: sistema_escolar_frontend
    restart: always
    environment:
      TZ: America/Santiago
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"

volumes:
  postgres_data:
  backend_uploads:
