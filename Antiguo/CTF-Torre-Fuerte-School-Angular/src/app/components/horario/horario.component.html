<!-- Encabezado -->
<section class="mb-6 flex justify-between items-center">
  <div>
    <h1 class="text-3xl font-bold text-gray-800">Horario de Clases</h1>
    <p class="text-gray-600">Organiza y visualiza tu calendario semanal</p>
  </div>
  <div class="flex space-x-3">
    <button
      (click)="navegarGestionAsignaturas()"
      class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors flex items-center">
      <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"></path>
      </svg>
      Gestionar Asignaturas
    </button>
  </div>
</section>

<!-- Tabla de Horario -->
<div class="bg-white p-4 rounded-xl shadow-md overflow-x-auto">
  <div class="grid grid-cols-6 gap-1 min-w-[800px]">
    <!-- Encabezados -->
    <div class="font-semibold text-center p-3 border-b-2 border-gray-300 bg-gray-50">Hora</div>
    <div *ngFor="let dia of dias" class="font-semibold text-center p-3 border-b-2 border-gray-300 bg-gray-50">
      {{ dia }}
    </div>

    <!-- Filas de horario -->
    <ng-container *ngFor="let hora of horas">
      <!-- Columna de hora -->
      <div class="font-medium text-sm text-gray-600 p-3 border-r border-b bg-gray-50 flex items-center">
        {{ hora }}
      </div>

      <!-- Bloques de asignaturas -->
      <div
        *ngFor="let dia of dias"
        (click)="abrirModal(dia, hora)"
        [ngClass]="obtenerColorClase(obtenerAsignatura(dia, hora))"
        class="p-3 border-b text-center font-medium rounded cursor-pointer hover:opacity-80 transition-opacity flex items-center justify-center min-h-[60px]">
        {{ obtenerAsignatura(dia, hora) }}
      </div>
    </ng-container>
  </div>
</div>

<!-- Modal para Editar Bloque -->
<div
  *ngIf="showModal"
  class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
  <div class="relative mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
    <div class="mt-3">
      <!-- Header del Modal -->
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg leading-6 font-medium text-gray-900">Editar Bloque de Horario</h3>
        <button
          (click)="cerrarModal()"
          class="text-gray-400 hover:text-gray-500">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>

      <!-- Contenido del Modal -->
      <div class="mt-2 px-7 py-3">
        <div class="text-sm text-gray-600 mb-4">
          Bloque: <span class="font-semibold">{{ bloqueSeleccionado.dia }} - {{ bloqueSeleccionado.hora }}</span>
        </div>

        <div class="space-y-4">
          <div>
            <label for="asignatura-select" class="block text-sm font-medium text-gray-700 mb-1">
              Asignatura
            </label>
            <select
              id="asignatura-select"
              [(ngModel)]="asignaturaSeleccionada"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500">
              <option value="">-- Sin asignatura --</option>
              <option *ngFor="let asignatura of asignaturas" [value]="asignatura">
                {{ asignatura }}
              </option>
            </select>
          </div>
        </div>
      </div>

      <!-- Footer del Modal -->
      <div class="items-center px-4 py-3 border-t border-gray-200 sm:px-6 sm:flex sm:flex-row-reverse">
        <button
          (click)="guardarBloque()"
          type="button"
          class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-purple-600 text-base font-medium text-white hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 sm:ml-3 sm:w-auto sm:text-sm">
          Guardar
        </button>
        <button
          (click)="cerrarModal()"
          type="button"
          class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
