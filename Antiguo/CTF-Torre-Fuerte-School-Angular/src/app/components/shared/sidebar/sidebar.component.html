<aside class="w-64 bg-purple-800 text-white flex flex-col h-full">
  <!-- Logo/Brand -->
  <div class="p-6 text-2xl font-bold border-b border-purple-700 flex-shrink-0">
    Torre Fuerte School
  </div>

  <!-- Navigation -->
  <nav class="flex-1 py-4 overflow-y-auto">
    <div *ngFor="let item of navItems">
      <!-- Item Principal -->
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-purple-700"
        [routerLinkActiveOptions]="{exact: item.children ? true : false}"
        (click)="item.children ? toggleDropdown(item, $event) : setActive(item)"
        class="flex items-center justify-between px-6 py-3 hover:bg-purple-700 transition-colors cursor-pointer">

        <div class="flex items-center">
          <!-- Icono Home -->
          <svg *ngIf="item.icon === 'home'" class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
          </svg>

          <!-- Icono Calendar -->
          <svg *ngIf="item.icon === 'calendar'" class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path>
          </svg>

          <!-- Icono Clipboard -->
          <svg *ngIf="item.icon === 'clipboard'" class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 1 1 0 000 2H6a2 2 0 100 4h2a2 2 0 100 4h2a1 1 0 100 2 2 2 0 01-2 2H6a2 2 0 01-2-2V5z" clip-rule="evenodd"></path>
          </svg>

          <!-- Icono Matrícula -->
          <svg *ngIf="item.icon === 'matricula'" class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h9a2 2 0 002-2V5a2 2 0 00-2-2H4zm1 3a1 1 0 012 0v8a1 1 0 11-2 0V6zm4 0a1 1 0 012 0v8a1 1 0 11-2 0V6z" clip-rule="evenodd"></path>
          </svg>

          <!-- Icono Book -->
          <svg *ngIf="item.icon === 'book'" class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"></path>
          </svg>

          <!-- Icono Clock -->
          <svg *ngIf="item.icon === 'clock'" class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path>
          </svg>

          {{ item.label }}
        </div>

        <!-- Icono de Flecha para Dropdown -->
        <svg
          *ngIf="item.children && item.children.length > 0"
          class="w-4 h-4 transition-transform duration-300"
          [class.rotate-180]="item.expanded"
          fill="currentColor"
          viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
      </a>

      <!-- Subitems (Dropdown) -->
      <div
        *ngIf="item.children && item.expanded"
        class="bg-purple-900 transition-all duration-300">
        <a
          *ngFor="let child of item.children"
          [routerLink]="child.route"
          routerLinkActive="bg-purple-600"
          [routerLinkActiveOptions]="{exact: true}"
          (click)="setActive(child)"
          class="flex items-center px-6 py-3 pl-14 hover:bg-purple-600 transition-colors cursor-pointer text-sm">

          <!-- Icono del subitem -->
          <svg *ngIf="child.icon === 'clipboard'" class="w-4 h-4 mr-3" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 1 1 0 000 2H6a2 2 0 100 4h2a2 2 0 100 4h2a1 1 0 100 2 2 2 0 01-2 2H6a2 2 0 01-2-2V5z" clip-rule="evenodd"></path>
          </svg>

          {{ child.label }}
        </a>
      </div>
    </div>
  </nav>

  <!-- Footer -->
  <div class="p-4 border-t border-purple-700 flex-shrink-0">
    <div class="text-xs text-purple-300 text-center">
      © 2026 Torre Fuerte School
    </div>
  </div>
</aside>
